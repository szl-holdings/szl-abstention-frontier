name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Verify strict held-out bundle qualification (stdlib only)
        run: python -m unittest discover -s tests -p test_qualification.py -v
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Installed qualification CLI smoke (no GPU or provider)
        run: |
          szl-abstain-qualify --help > /dev/null
          python -c "from szl_abstention_frontier.qualify import SCHEMA; assert SCHEMA == 'szl.abstention.heldout-quality-review/v1'"
      - name: Install pinned unit test runner
        run: python -m pip install --disable-pip-version-check pytest==9.2.0
      - name: Unit tests
        run: python -m pytest tests -q
